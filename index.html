<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Deep Signal</title><style>*{box-sizing:border-box}body{margin:0;background:#06111a;color:#d8fbff;font:12px system-ui;overflow:hidden}#app{width:240px;height:282px;margin:auto;background:radial-gradient(circle at 50% 40%,#123647,#06111a 65%);position:relative;overflow:hidden}header{height:38px;padding:6px 8px;border-bottom:1px solid #2dd9e9}b{color:#77f6ff}.tabs{display:flex;gap:3px;padding:4px}.tabs button,.buy{background:#102a36;color:#d8fbff;border:1px solid #327d8c;border-radius:5px;font-size:10px;padding:4px}.tabs .on{background:#155567}.panel{padding:5px 7px;height:212px;overflow:auto}.res{display:flex;justify-content:space-between;background:#081b25;padding:5px;border-radius:5px;margin-bottom:4px}.node{display:grid;grid-template-columns:34px 1fr 55px;gap:5px;align-items:center;background:#0b202b;border:1px solid #214c58;border-radius:7px;padding:5px;margin:4px 0}.ico{font-size:22px;text-align:center}.small{font-size:9px;color:#8eb8c0}.locked{opacity:.38}.foot{position:absolute;bottom:0;width:100%;height:28px;padding:4px 7px;border-top:1px solid #194652;background:#07151d}.bar{height:5px;background:#132b32;border-radius:4px}.bar i{display:block;height:100%;background:#63e8ee;border-radius:4px}button:active{transform:scale(.97)}</style><div id="app"><header><b>DEEP SIGNAL</b><div class="small">THE MACHINE IS LISTENING</div></header><div class="tabs"><button data-tab="grid" class="on">NODES</button><button data-tab="cores">CORES</button><button data-tab="archive">ARCHIVE</button><button id="prestige">DESCEND</button></div><main class="panel" id="panel"></main><div class="foot"><span id="hint">Wheel: select • side: buy</span><div class="bar"><i id="progress"></i></div></div></div><script>
const nodes=[['Collector','⚙',10,1,1.12,'signal'],['Resonator','◈',75,7,1.13,'signal'],['Drone Bay','▣',650,55,1.14,'signal'],['Crystal Forge','◆',6200,430,1.145,'matter'],['Echo Array','⌁',55000,3400,1.15,'data'],['Null Reactor','◉',6e5,26000,1.155,'energy'],['Star Engine','✦',8e6,2e5,1.16,'echo']];let S=JSON.parse(localStorage.ds||'null')||{signal:25,matter:0,data:0,energy:0,echo:0,depth:0,life:0,n:Array(nodes.length).fill(0),tab:'grid',sel:0,last:Date.now()};function fmt(n){if(n<1000)return n.toFixed(n<10?1:0);for(let u of ['K','M','B','T','Qa']){n/=1000;if(n<1000)return n.toFixed(1)+u}return n.toExponential(1)}function mult(){return Math.pow(1.8,S.depth)}function prod(){return nodes.reduce((a,x,i)=>a+x[3]*S.n[i],0)*mult()}function cost(i){let n=nodes[i];return n[2]*Math.pow(n[4],S.n[i])}function save(){S.last=Date.now();localStorage.ds=JSON.stringify(S)}function buy(i){let c=cost(i);if(S.signal>=c){S.signal-=c;S.n[i]++;render();save()}}function render(){let p=document.querySelector('#panel');document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));if(S.tab==='grid'){p.innerHTML=`<div class=res><span>Signal <b>${fmt(S.signal)}</b></span><span>${fmt(prod())}/s</span></div><div class=res><span>Depth <b>${S.depth}</b></span><span>x${mult().toFixed(1)}</span></div>`+nodes.map((n,i)=>`<div class="node ${i===S.sel?'sel':''}" style="outline:${i===S.sel?'1px solid #7ff':'none'}" onclick="S.sel=${i};buy(${i})"><div class=ico>${n[1]}</div><div><b>${n[0]}</b><div class=small>${fmt(n[3]*mult())}/s each • owned ${S.n[i]}</div></div><button class=buy>${fmt(cost(i))}</button></div>`).join('')}else if(S.tab==='cores')p.innerHTML=`<h3>CORE LATTICE</h3><p>Each descent permanently amplifies every machine by <b>×1.8</b>.</p><p>Next descent requires lifetime Signal ≥ <b>${fmt(1e5*Math.pow(8,S.depth))}</b>.</p><p>Depth unlock roadmap:</p><p>1 Matter Synthesis<br>2 Auto-buy<br>3 Echo expeditions<br>4 Artifact sockets<br>5 Temporal loops<br>8 Singularity layer</p>`;else p.innerHTML=`<h3>ARCHIVE</h3><p>The buried machine predates every settlement record. Each descent exposes a deeper network.</p><p><b>Lifetime signal:</b> ${fmt(S.life)}</p><p><b>Nodes owned:</b> ${S.n.reduce((a,b)=>a+b,0)}</p><p><b>Deepest layer:</b> ${S.depth}</p>`;document.querySelector('#progress').style.width=Math.min(100,S.life/(1e5*Math.pow(8,S.depth))*100)+'%'}function descend(){let req=1e5*Math.pow(8,S.depth);if(S.life>=req){S.depth++;S.signal=25;S.n.fill(0);save();render()}}document.querySelector('#prestige').onclick=descend;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});function step(d){if(S.tab==='grid'){S.sel=(S.sel+d+nodes.length)%nodes.length;render()}}addEventListener('scrollUp',()=>step(-1));addEventListener('scrollDown',()=>step(1));addEventListener('sideClick',()=>S.tab==='grid'&&buy(S.sel));addEventListener('keydown',e=>{if(e.key==='ArrowUp')step(-1);if(e.key==='ArrowDown')step(1);if(e.key==='Enter'||e.key===' ')buy(S.sel)});let offline=Math.min(14400,(Date.now()-S.last)/1000);S.signal+=prod()*offline*.5;S.life+=prod()*offline*.5;setInterval(()=>{let x=prod()/10;S.signal+=x;S.life+=x;render()},100);setInterval(save,3000);render();navigator.wakeLock?.request('screen').catch(()=>{});
</script>
